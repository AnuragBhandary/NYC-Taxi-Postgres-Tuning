[project]
name = "taxibench"
version = "1.0.0"
description = "38M NYC taxi trips in PostgreSQL: a 12-query analytical suite tuned with monthly partitions, BRIN and covering indexes and materialized views, every plan checked with EXPLAIN ANALYZE, and the same suite on MySQL 8."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Anurag Bhandary" }]
dependencies = [
    "pyarrow>=17",
    "psycopg[binary]>=3.2",
    "pymysql>=1.1",
]

[project.scripts]
taxibench = "taxibench.cli:main"

[dependency-groups]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11", "types-pymysql>=1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taxibench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["taxibench"]
omit = ["*/taxibench/__main__.py"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.mypy]
python_version = "3.12"
packages = ["taxibench"]
mypy_path = "src"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true
